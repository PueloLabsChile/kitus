name: Actualizar contenido

# Trae los últimos videos del canal y republica notas completas de los medios con
# licencia Creative Commons listados en scripts/fuentes.json. Si algo cambió, hace
# commit — y eso dispara el redeploy del hosting (Netlify).
#
# Además, si aparecieron notas nuevas, manda un correo con sus títulos. Para que
# el correo funcione hay que cargar 3 secrets en el repo
# (Settings › Secrets and variables › Actions):
#   MAIL_USERNAME  → una dirección de Gmail (la que envía)
#   MAIL_PASSWORD  → "contraseña de aplicación" de esa cuenta de Gmail (16 letras)
#   MAIL_TO        → a dónde llega el aviso
# Si no están cargados, el resto (traer notas + publicar) sigue funcionando igual.

on:
  schedule:
    # Cada 10 minutos. GitHub corre los cron "cuando puede": en horas de carga
    # puede demorar 10-20 min o saltarse una vuelta. No es un reloj exacto.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # botón para ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-contenido
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      # Se expone a nivel job para poder saltar el paso del correo si no hay secret.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer videos y notas sindicadas
        run: node scripts/actualizar.mjs

      - name: Ver qué cambió
        id: cambios
        run: |
          rutas="src/data public/uploads src/content/articulos"
          if [[ -z "$(git status --porcelain $rutas)" ]]; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios."
            exit 0
          fi
          echo "hay_cambios=true" >> "$GITHUB_OUTPUT"

          # Títulos de las notas sindicadas nuevas (archivos aún sin rastrear).
          titulos=""
          while read -r f; do
            [[ -z "$f" ]] && continue
            t=$(sed -n 's/^titulo: *"\(.*\)"$/\1/p' "$f" | head -1)
            titulos+="- ${t:-$f}"$'\n'
          done < <(git status --porcelain src/content/articulos \
                     | awk '$1=="??" && $2 ~ /sind__.*\.md$/ {print $2}')

          if [[ -n "$titulos" ]]; then
            n=$(printf '%s' "$titulos" | grep -c '^- ')
            echo "hay_notas=true" >> "$GITHUB_OUTPUT"
            echo "asunto=Kitus: $n nota(s) nueva(s)" >> "$GITHUB_OUTPUT"
            {
              echo "cuerpo<<FIN"
              echo "Se publicaron $n nota(s) nueva(s) en Kitus:"
              echo
              printf '%s' "$titulos"
              echo
              echo "Ver el sitio: https://kitus.netlify.app/"
              echo "FIN"
            } >> "$GITHUB_OUTPUT"
          else
            echo "hay_notas=false" >> "$GITHUB_OUTPUT"
          fi

          # Resumen visible en la pestaña Actions de esta corrida.
          {
            echo "### Actualización de contenido"
            git status --porcelain $rutas
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit y push
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          rutas="src/data public/uploads src/content/articulos"
          git config user.name "kitus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $rutas
          git commit -m "Auto: actualiza videos y notas de medios aliados"
          git push


      - name: Compilar y publicar en cPanel
        if: steps.cambios.outputs.hay_cambios == 'true'
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_DESTINATION: ${{ secrets.CPANEL_DESTINATION }}
        run: |
          set -euo pipefail
          : "${CPANEL_HOST:?Falta CPANEL_HOST}"
          : "${CPANEL_USERNAME:?Falta CPANEL_USERNAME}"
          : "${CPANEL_PASSWORD:?Falta CPANEL_PASSWORD}"
          : "${CPANEL_DESTINATION:?Falta CPANEL_DESTINATION}"
          npm ci
          npm run build
          release="kitus-release-${GITHUB_RUN_ID}.zip"
          (cd dist && zip -qr "../$release" .)
          cookies="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$cookies" "$headers" "$release"' EXIT
          curl -ksS -D "$headers" -c "$cookies" -d "user=$CPANEL_USERNAME" --data-urlencode "pass=$CPANEL_PASSWORD" -d 'login_submit=Log+in' "https://$CPANEL_HOST:2083/login/" -o /dev/null
          token="$(sed -n 's#^[Ll]ocation: /\([^/]*\)/.*#\1#p' "$headers" | tr -d '\r' | head -1)"
          test -n "$token"
          base="https://$CPANEL_HOST:2083/$token"
          curl -ksS -b "$cookies" -F "dir=$CPANEL_DESTINATION" -F "file-1=@$release" "$base/execute/Fileman/upload_files" | grep -q '"status":1'
          curl -ksS -b "$cookies" -d 'cpanel_jsonapi_apiversion=2' -d 'cpanel_jsonapi_module=Fileman' -d 'cpanel_jsonapi_func=fileop' --data-urlencode 'op=extract' --data-urlencode "sourcefiles=$CPANEL_DESTINATION/$release" --data-urlencode "destfiles=$CPANEL_DESTINATION" --data-urlencode 'doubledecode=0' --data-urlencode 'metadata={"fileop":"extract"}' "$base/json-api/cpanel" | grep -q 'result.*1'

      - name: Avisar por correo si hay notas nuevas
        if: steps.cambios.outputs.hay_notas == 'true' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Kitus bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.cambios.outputs.asunto }}
          body: ${{ steps.cambios.outputs.cuerpo }}
