name: Actualizar contenido

# Trae los últimos videos del canal y el agregado internacional (titulares) de los
# feeds de scripts/fuentes.json. Si algo cambió, hace commit — y eso dispara el
# redeploy del hosting (Netlify / Cloudflare).

on:
  schedule:
    - cron: "0 */8 * * *" # cada 8 horas
  workflow_dispatch: {} # botón para ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-contenido
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer videos y titulares
        run: node scripts/actualizar.mjs

      - name: Commit si hubo cambios
        run: |
          if [[ -n "$(git status --porcelain src/data public/uploads)" ]]; then
            git config user.name "kitus-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data public/uploads
            git commit -m "Auto: actualiza videos y titulares [skip ci]"
            git push
          else
            echo "Sin cambios."
          fi
