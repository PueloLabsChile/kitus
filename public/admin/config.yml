# Panel de redacción de Kitus (Decap CMS)
# --------------------------------------------------------------------------
# En producción usa git-gateway + Netlify Identity: cada cambio guardado
# queda como commit en el repositorio y dispara un nuevo deploy.
# Para editar en local: `npm run cms` en una terminal y `npm run dev` en otra;
# se abre http://localhost:4321/admin/ y NO pide login (local_backend).

backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow
locale: "es"

collections:
  - name: "articulos"
    label: "Notas"
    label_singular: "Nota"
    folder: "src/content/articulos"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{fecha | date('DD/MM/YYYY')}} · {{seccion}} · {{titulo}}"
    sortable_fields: ["fecha", "titulo", "seccion"]
    view_filters:
      - label: "Borradores"
        field: borrador
        pattern: true
      - label: "Notas de opinión"
        field: opinion
        pattern: true
    fields:
      - { name: "titulo", label: "Titular", widget: "string" }
      - { name: "bajada", label: "Bajada", widget: "text" }
      - name: "seccion"
        label: "Sección"
        widget: "select"
        options:
          - { label: "Política", value: "politica" }
          - { label: "Internacional", value: "internacional" }
          - { label: "Economía", value: "economia" }
          - { label: "Derechos", value: "derechos" }
          - { label: "Opinión", value: "opinion" }
          - { label: "Cultura", value: "cultura" }
      - name: "autor"
        label: "Autor/a"
        widget: "relation"
        collection: "autores"
        search_fields: ["nombre"]
        value_field: "{{slug}}"
        display_fields: ["nombre"]
      - { name: "fecha", label: "Fecha", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: "etiquetas", label: "Etiquetas", widget: "list", required: false, hint: "Palabras clave; la primera aparece en la volanta." }
      - { name: "portada", label: "Foto de apertura", widget: "image", required: false, choose_url: false, media_library: { config: { max_file_size: 3000000 } } }
      - { name: "creditoPortada", label: "Epígrafe y crédito de la foto", widget: "string", required: false }
      - { name: "destacada", label: "Nota de tapa (va grande en la portada)", widget: "boolean", default: false }
      - { name: "opinion", label: "Es columna de opinión", widget: "boolean", default: false }
      - { name: "borrador", label: "Borrador (no se publica)", widget: "boolean", default: false }
      - { name: "body", label: "Texto de la nota", widget: "markdown" }

  - name: "autores"
    label: "Autores/as"
    label_singular: "Autor/a"
    folder: "src/content/autores"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "nombre"
    fields:
      - { name: "nombre", label: "Nombre", widget: "string" }
      - { name: "iniciales", label: "Iniciales (para el avatar)", widget: "string", pattern: ['^.{1,3}$', "Máximo 3 caracteres"] }
      - { name: "rol", label: "Rol", widget: "string", default: "Redacción" }
      - { name: "bio", label: "Bio breve", widget: "text" }
