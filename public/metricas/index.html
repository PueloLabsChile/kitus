<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Métricas | Kitus</title>
    <style>
      :root { color-scheme: light; --tinta: #172331; --azul: #1e5d89; --papel: #f6f2ea; --linea: #d9d2c7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--papel); color: var(--tinta); font-family: Georgia, 'Times New Roman', serif; }
      main { width: min(92vw, 620px); padding: 2.8rem 2.5rem; background: #fffdf9; border: 1px solid var(--linea); box-shadow: 0 18px 45px rgba(23,35,49,.1); }
      .marca { margin: 0 0 2.7rem; color: var(--azul); font: 700 1.15rem/1 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.3rem); line-height: 1; }
      .bajada { margin: .85rem 0 2.2rem; color: #56616b; font: 1rem/1.5 Arial, sans-serif; }
      .tarjeta { padding: 1.7rem; border-top: 4px solid var(--azul); background: #eef4f7; }
      .etiqueta { display: block; color: #40505d; font: 700 .73rem/1 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
      #total { display: block; margin-top: .45rem; font: 700 clamp(3.6rem, 15vw, 6.6rem)/.9 Arial, sans-serif; letter-spacing: -.07em; }
      .nota { margin: 1.7rem 0 0; color: #68727a; font: .85rem/1.45 Arial, sans-serif; }
      .error { color: #9a2c2c; }
    </style>
  </head>
  <body>
    <main>
      <p class="marca">Kitus · Métricas</p>
      <h1>Lecturas del periódico</h1>
      <p class="bajada">Contador general de entradas al sitio.</p>
      <section class="tarjeta" aria-live="polite">
        <span class="etiqueta">Visitas registradas</span>
        <strong id="total">—</strong>
      </section>
      <p class="nota" id="estado">Actualizando…</p>
    </main>
    <script>
      const acceso = new URLSearchParams(location.search).get('acceso');
      const total = document.querySelector('#total');
      const estado = document.querySelector('#estado');
      if (!acceso) {
        estado.textContent = 'Este panel requiere un enlace de acceso.';
        estado.classList.add('error');
      } else {
        fetch(`/api/visitas.php?acceso=${encodeURIComponent(acceso)}`, { cache: 'no-store', credentials: 'same-origin' })
          .then(r => r.json())
          .then(data => {
            if (typeof data.total !== 'number') throw new Error('sin acceso');
            total.textContent = new Intl.NumberFormat('es-CL').format(data.total);
            estado.textContent = `Actualizado el ${new Intl.DateTimeFormat('es-CL', { dateStyle: 'long', timeStyle: 'short' }).format(new Date())}.`;
          })
          .catch(() => { estado.textContent = 'No fue posible cargar las métricas.'; estado.classList.add('error'); });
      }
    </script>
  </body>
</html>
